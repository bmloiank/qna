<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- https://kin.naver.com/qna/detail.naver?d1id=7&dirId=70114&docId=495258834 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- 
    div : 박스 
    h : 제목
    p : 본문 (block요소 : 밑으로 쌓인다.)

    span : 박스랑 비슷한데 내용만 크기를 갖는(inline요소)
    a : 하이퍼텍스트링크
    strong : 강조하고 싶은 태그 (글씨 굵게)
    blod : 글씨를 굵게

    -->
    <main>
        <div class='container'>
            <div class="title">
                <span class="question_mark">Q.</span> {{question.title}}
            </div>
            <div>
                <span class="writer">{{question.writer}}</span>
                <span class="created_at">{{question.created_at}}</span>
            </div>
            <div class="text">
                {{question.text}}
            </div>
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <!-- 벡터 이미지 -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-three-dots" viewBox="0 0 16 16">
                        <path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3m5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3"/>
                    </svg>
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="/edit/{{question.id}}">수정</a></li>
                    <li><a class="dropdown-item" href="/delete/{{question.id}}">삭제</a></li>
                </ul>
            </div>
        </div>        
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
