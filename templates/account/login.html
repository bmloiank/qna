<!DOCTYPE html>
<html lang="en">
<head>...</head>
<body>
    <div>현재 상태 : Guest</div>
    <div>
        <form method="post" action="{% url 'account:login' %}">
            {% csrf_token %}
            <div>
                <label for="username">사용자ID</label>

            <button type="submit">로그인</button>
        </form>
    </div>
</body>
</html>
